services:
    ByteSpin\ConsoleCommandSchedulerBundle\Controller\Admin\SchedulerCrudController:
        autowire: true
        autoconfigure: true
        public: false
        tags: [ 'controller.service_arguments' ]
        arguments:
            $consoleCommandProvider: '@ByteSpin\ConsoleCommandSchedulerBundle\Provider\ConsoleCommandProvider'
            $bundleVersionProvider: '@ByteSpin\ConsoleCommandSchedulerBundle\Provider\BundleVersionProvider'
            $messengerQueueProvider: '@ByteSpin\ConsoleCommandSchedulerBundle\Provider\MessengerQueueProvider'
            $cache: '@cache.app'
    ByteSpin\ConsoleCommandSchedulerBundle\Controller\Admin\SchedulerLogCrudController:
        autowire: true
        autoconfigure: true
        public: false
        tags: ['controller.service_arguments']
        arguments:
            $bundleVersionProvider: '@ByteSpin\ConsoleCommandSchedulerBundle\Provider\BundleVersionProvider'
    ByteSpin\ConsoleCommandSchedulerBundle\Provider\ConsoleCommandProvider:
        autowire: true
        autoconfigure: true
        public: false
        arguments:
            $kernel: '@Symfony\Component\HttpKernel\KernelInterface'
    ByteSpin\ConsoleCommandSchedulerBundle\Provider\BundleVersionProvider:
        autowire: true
        autoconfigure: true
        public: false
        arguments:
            $projectDir: '%kernel.project_dir%'
            $cache: '@cache.app'
    ByteSpin\ConsoleCommandSchedulerBundle\Provider\MessengerQueueProvider:
        autowire: true
        autoconfigure: true
        public: false
        arguments:
            $locator: '@messenger.receiver_locator'
    ByteSpin\ConsoleCommandSchedulerBundle\Job\JobOutputCollector:
        autowire: true
        autoconfigure: true
        public: false
        shared: true
        arguments:
            $cachePool: '@cache.app'
    ByteSpin\ConsoleCommandSchedulerBundle\Processor\NotificationProcessor:
        autowire: true
        autoconfigure: true
        public: false
        arguments:
            $mailer: '@Symfony\Component\Mailer\MailerInterface'
            $cachePool: '@cache.app'
            $mailFrom: '%env(BYTESPIN_FROM_EMAIL)%'
            $schedulerRepository: '@ByteSpin\ConsoleCommandSchedulerBundle\Repository\SchedulerRepository'
    ByteSpin\ConsoleCommandSchedulerBundle\Repository\SchedulerRepository:
        autowire: true
        autoconfigure: true
        public: false
        tags: [ 'controller.service_arguments' ]
    ByteSpin\ConsoleCommandSchedulerBundle\Factory\ConsoleCommandIntrospector:
        autowire: true
        autoconfigure: true
        public: false
        arguments:
            $kernel: '@Symfony\Component\HttpKernel\KernelInterface'
    ByteSpin\ConsoleCommandSchedulerBundle\Factory\CommandIntrospectorInterface: '@ByteSpin\ConsoleCommandSchedulerBundle\Factory\ConsoleCommandIntrospector'
    ByteSpin\ConsoleCommandSchedulerBundle\Factory\RecurringMessageFactory:
        autowire: true
        autoconfigure: true
        public: false
        arguments:
            $commandIntrospector: '@ByteSpin\ConsoleCommandSchedulerBundle\Factory\CommandIntrospectorInterface'
    ByteSpin\ConsoleCommandSchedulerBundle\Validator\ValidSchedulerEntryValidator:
        autowire: true
        autoconfigure: true
        public: false
        arguments:
            $recurringMessageFactory: '@ByteSpin\ConsoleCommandSchedulerBundle\Factory\RecurringMessageFactory'
    ByteSpin\ConsoleCommandSchedulerBundle\Command\LintSchedulerCommand:
        autowire: true
        autoconfigure: true
        arguments:
            $schedulerRepository: '@ByteSpin\ConsoleCommandSchedulerBundle\Repository\SchedulerRepository'
            $recurringMessageFactory: '@ByteSpin\ConsoleCommandSchedulerBundle\Factory\RecurringMessageFactory'
    ByteSpin\ConsoleCommandSchedulerBundle\Scheduler\ConsoleJobsScheduler:
        autowire: true
        autoconfigure: true
        public: false
        tags: [ 'controller.service_arguments' ]
        arguments:
            $schedulerRepository: '@ByteSpin\ConsoleCommandSchedulerBundle\Repository\SchedulerRepository'
            $recurringMessageFactory: '@ByteSpin\ConsoleCommandSchedulerBundle\Factory\RecurringMessageFactory'
            $eventDispatcher: '@Symfony\Component\EventDispatcher\EventDispatcherInterface'
            $cache: '@Symfony\Contracts\Cache\CacheInterface'
            $lockFactory: '@Symfony\Component\Lock\LockFactory'
            $logger: '@?logger'
            $processOnlyLastMissedRun: '%bytespin_scheduler.process_only_last_missed_run%'
    ByteSpin\ConsoleCommandSchedulerBundle\EventSubscriber\ScheduledConsoleCommandEventSubscriber:
        autowire: true
        autoconfigure: true
        public: false
        tags: [ 'controller.service_arguments' ]
        arguments:
            $managerRegistry: '@Doctrine\Persistence\ManagerRegistry'
            $notificationProcessor: '@ByteSpin\ConsoleCommandSchedulerBundle\Processor\NotificationProcessor'
    ByteSpin\ConsoleCommandSchedulerBundle\EventSubscriber\ScheduledConsoleCommandOutputEventSubscriber:
        autowire: true
        autoconfigure: true
        public: false
        tags: [ 'controller.service_arguments' ]
        arguments:
            $outputCollector: '@ByteSpin\ConsoleCommandSchedulerBundle\Job\JobOutputCollector'
    ByteSpin\ConsoleCommandSchedulerBundle\EventSubscriber\SchedulerEasyAdminEventSubscriber:
        autowire: true
        autoconfigure: true
        public: false
    ByteSpin\ConsoleCommandSchedulerBundle\MessageHandler\ExecuteConsoleCommandHandler:
        autowire: true
        autoconfigure: true
        public: false
        tags: [ 'controller.service_arguments' ]
        arguments:
            $eventDispatcher: '@Symfony\Component\EventDispatcher\EventDispatcherInterface'
            $durationConverter: '@ByteSpin\ConsoleCommandSchedulerBundle\Converter\DurationConverter'
    ByteSpin\ConsoleCommandSchedulerBundle\Command\ConfigureBundleCommand:
        autowire: true
        autoconfigure: true
    ByteSpin\ConsoleCommandSchedulerBundle\Converter\DurationConverter:
        autowire: true
        autoconfigure: true
        public: false


